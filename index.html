<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>উপস্থিতি স্ক্যানার</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; background: #f4f6f8; color: #1f2937; }
    header { background: #0b6b4f; color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; }
    header small { opacity: .85; }
    .wrap { padding: 12px; max-width: 560px; margin: 0 auto; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 11px; color: #6b7280; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 260px; }
    #result { margin: 12px 0; padding: 14px; border-radius: 12px; background: #fff; text-align: center; min-height: 84px; font-size: 16px; }
    #result .big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .present { background: #d1fae5 !important; color: #065f46; }
    .late { background: #fef3c7 !important; color: #92400e; }
    .duplicate { background: #dbeafe !important; color: #1e40af; }
    .error { background: #fee2e2 !important; color: #991b1b; }
    #result img.photo { width: 120px; height: 120px; object-fit: cover; border-radius: 14px; margin: 0 auto 8px; display: block; border: 3px solid rgba(0,0,0,.12); }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type=text] { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; }
    button { padding: 12px 16px; font-size: 15px; border: 0; border-radius: 10px; background: #0b6b4f; color: #fff; cursor: pointer; }
    button.sec { background: #374151; }
    #absentBox { background: #fff; border-radius: 12px; padding: 12px; display: none; }
    #absentBox h3 { margin: 0 0 8px; font-size: 15px; }
    #absentBox li { padding: 4px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    #startBtn { width: 100%; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="school">উপস্থিতি স্ক্যানার</h1>
    <small id="today"></small>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="sTotal">-</b><span>মোট</span></div>
      <div class="stat"><b id="sPresent">-</b><span>উপস্থিত</span></div>
      <div class="stat"><b id="sLate">-</b><span>দেরি</span></div>
      <div class="stat"><b id="sAbsent">-</b><span>অনুপস্থিত</span></div>
    </div>

    <button id="startBtn" onclick="startScanner()">ক্যামেরা চালু করুন</button>
    <div id="reader"></div>

    <div id="result">QR বা বারকোড ক্যামেরার সামনে ধরুন</div>

    <button id="photoBtn" class="sec" style="width:100%;margin-bottom:12px" onclick="document.getElementById('fileScan').click()">ছবি তুলে স্ক্যান করুন (বিকল্প)</button>
    <input type="file" id="fileScan" accept="image/*" capture="environment" style="display:none">
    <div id="reader-file" style="display:none"></div>

    <div class="row">
      <input type="text" id="manualId" placeholder="ম্যানুয়ালি আইডি লিখুন (যেমন S001)" autocomplete="off">
      <button onclick="manualSubmit()">জমা</button>
    </div>

    <button class="sec" style="width:100%" onclick="toggleAbsent()">আজকের অনুপস্থিত তালিকা</button>
    <div id="absentBox" style="margin-top:12px"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // ↓↓↓ Apps Script ডিপ্লয়ের পর পাওয়া /exec লিংকটা এখানে বসান ↓↓↓
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL7jo2DJdwI__PmCTIaCgeXYzVMOzb_w3D62EdQ0ezckxIphi4WQq2aOK0SgueF-b1Sg/exec';

    let scanner = null;
    let busy = false;
    let lastCode = '';
    let lastTime = 0;
    let PIN = '';
    try { PIN = localStorage.getItem('att_pin') || ''; } catch (e) {}

    function askPin() {
      const p = prompt('পিন দিন');
      if (p && p.trim()) {
        PIN = p.trim();
        try { localStorage.setItem('att_pin', PIN); } catch (e) {}
      }
      return !!PIN;
    }

    // Apps Script API কল। ভুল পিন হলে একবার আবার পিন চেয়ে চেষ্টা করে।
    function api(action, params, retried) {
      const q = new URLSearchParams(Object.assign({ action: action, pin: PIN }, params || {}));
      return fetch(API_URL + '?' + q.toString())
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.badPin) {
            PIN = '';
            try { localStorage.removeItem('att_pin'); } catch (e) {}
            if (!retried && askPin()) return api(action, params, true);
          }
          return j;
        });
    }

    function beep(ok) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        o.frequency.value = ok ? 880 : 300;
        o.connect(ctx.destination);
        o.start();
        setTimeout(function () { o.stop(); ctx.close(); }, ok ? 120 : 350);
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
    }

    function startScanner() {
      if (scanner) return;
      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScan,
        function () {}
      ).then(function () {
        document.getElementById('startBtn').style.display = 'none';
      }).catch(function (err) {
        scanner = null;
        var why = (err && (err.name || err.message)) ? (err.name || '') + ' ' + (err.message || '') : String(err);
        show({ ok: false, type: 'error', msg: 'ক্যামেরা চালু হয়নি। ব্রাউজারে ক্যামেরার অনুমতি দিন, অথবা "ছবি তুলে স্ক্যান করুন" ব্যবহার করুন। (' + why.trim() + ')' });
      });
    }

    // বিকল্প: ফোনের নিজস্ব ক্যামেরায় ছবি তুলে কোড পড়া
    document.getElementById('fileScan').addEventListener('change', function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const fs = new Html5Qrcode('reader-file');
      fs.scanFile(file, false).then(function (text) {
        lastCode = '';
        onScan(text);
        fs.clear();
      }).catch(function () {
        show({ ok: false, type: 'error', msg: 'ছবিতে কোড পড়া যায়নি। কোডটা কাছ থেকে, পরিষ্কার ও আলোতে তুলে আবার চেষ্টা করুন।' });
        try { fs.clear(); } catch (x) {}
      });
      e.target.value = '';
    });

    function onScan(text) {
      const now = Date.now();
      // একই কোড ৫ সেকেন্ডের মধ্যে আবার পাঠানো হবে না
      if (busy || (text === lastCode && now - lastTime < 5000)) return;
      busy = true;
      lastCode = text;
      lastTime = now;
      send(text);
    }

    function manualSubmit() {
      const el = document.getElementById('manualId');
      const v = el.value.trim();
      if (!v || busy) return;
      busy = true;
      send(v);
      el.value = '';
    }

    function send(id) {
      document.getElementById('result').className = '';
      document.getElementById('result').textContent = 'যাচাই হচ্ছে...';
      api('scan', { id: id })
        .then(function (res) { show(res); busy = false; loadSummary(); })
        .catch(function (e) {
          show({ ok: false, type: 'error', msg: 'সংযোগ ত্রুটি। ইন্টারনেট ও API_URL দেখুন। (' + e.message + ')' });
          busy = false;
        });
    }

    function show(r) {
      const box = document.getElementById('result');
      box.className = r.type || '';
            let html = '';
      if (r.photo && /^data:image\//.test(r.photo)) html += '<img class="photo" alt="" src="' + r.photo + '">';
      html += '<div class="big">' + esc(r.msg || '') + '</div>';
      if (r.name) html += '<div>' + esc(r.name) + (r.cls ? ' — ' + esc(r.cls) : '') + (r.roll ? ' (রোল ' + esc(r.roll) + ')' : '') + '</div>';
      if (r.time) html += '<div style="font-size:13px;opacity:.8">' + esc(r.time) + '</div>';
      box.innerHTML = html;
      beep(!!r.ok);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    let lastSummary = null;
    function loadSummary() {
      return api('summary').then(function (s) {
        if (!s || !s.ok) return;
        lastSummary = s;
        document.getElementById('today').textContent = s.date;
        document.getElementById('sTotal').textContent = s.total;
        document.getElementById('sPresent').textContent = s.present;
        document.getElementById('sLate').textContent = s.late;
        document.getElementById('sAbsent').textContent = s.absentCount;
        renderAbsent();
      }).catch(function () {});
    }

    function renderAbsent() {
      if (!lastSummary) return;
      const box = document.getElementById('absentBox');
      if (!lastSummary.absent.length) { box.innerHTML = '<h3>সবাই উপস্থিত</h3>'; return; }
      box.innerHTML = '<h3>অনুপস্থিত (' + lastSummary.absent.length + ')</h3><ol>' +
        lastSummary.absent.map(function (a) {
          return '<li>' + esc(a.name) + ' — ' + esc(a.cls) + (a.roll ? ' (রোল ' + esc(a.roll) + ')' : '') + '</li>';
        }).join('') + '</ol>';
    }

    function toggleAbsent() {
      const box = document.getElementById('absentBox');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
      loadSummary();
    }

    document.getElementById('manualId').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') manualSubmit();
    });

    // শুরু: পিন না থাকলে চাওয়া, তারপর স্কুলের নাম ও সারাংশ লোড
    if (!PIN) askPin();
    api('config').then(function (c) {
      if (c && c.ok && c.school) document.getElementById('school').textContent = c.school;
    }).catch(function () {}).then(loadSummary);
  </script>
</body>
</html>
