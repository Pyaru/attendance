<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>শিক্ষক হাজিরা — ফেস স্ক্যান</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; background: #f4f6f8; color: #1f2937; }
    header { background: #0b6b4f; color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; }
    header small { opacity: .85; }
    .wrap { padding: 12px; max-width: 520px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 12px; }
    .cam { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 14px; overflow: hidden; }
    .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .cam .ring { position: absolute; left: 50%; top: 46%; width: 62%; aspect-ratio: 3 / 4; transform: translate(-50%, -50%); border: 3px dashed rgba(255,255,255,.7); border-radius: 50%; pointer-events: none; }
    .cam .tip { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; color: #fff; text-align: center; background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 15px; }
    #result { margin: 12px 0; padding: 14px; border-radius: 12px; background: #fff; text-align: center; min-height: 84px; font-size: 16px; }
    #result .big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .present { background: #d1fae5 !important; color: #065f46; }
    .late { background: #fef3c7 !important; color: #92400e; }
    .out { background: #e0e7ff !important; color: #3730a3; }
    .duplicate { background: #dbeafe !important; color: #1e40af; }
    .error { background: #fee2e2 !important; color: #991b1b; }
    button { padding: 12px 16px; font-size: 15px; border: 0; border-radius: 10px; background: #0b6b4f; color: #fff; cursor: pointer; }
    button.sec { background: #374151; } button.red { background: #b91c1c; } button.light { background: #e5e7eb; color: #111827; }
    button:disabled { opacity: .5; }
    .full { width: 100%; margin-bottom: 10px; }
    select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 10px; background: #fff; }
    .sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .sum div { background: #f3f4f6; border-radius: 10px; padding: 8px 2px; text-align: center; font-size: 11px; }
    .sum b { display: block; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 7px 4px; border-bottom: 1px solid #f1f5f9; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .d-present { background: #10b981; } .d-late { background: #f59e0b; } .d-absent { background: #ef4444; }
    .hint { font-size: 13px; color: #6b7280; margin: 6px 0 12px; }
    #prog { height: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    #prog i { display: block; height: 100%; width: 0; background: #0b6b4f; transition: width .3s; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1 id="school">শিক্ষক হাজিরা — ফেস স্ক্যান</h1>
    <small id="today"></small>
  </header>

  <div class="wrap">
    <!-- ===== হাজিরা কিয়স্ক ===== -->
    <div id="kiosk">
      <div class="cam"><video id="vid" autoplay playsinline muted></video><div class="ring"></div><div class="tip" id="tip">মডেল লোড হচ্ছে...</div></div>
      <div id="result">ক্যামেরার সামনে এসে সোজা তাকান</div>
      <button class="sec full" onclick="toggleList()">আজকের তালিকা</button>
      <div id="listBox" class="card hidden"></div>
      <button class="light full" onclick="goEnroll()">অ্যাডমিন: চেহারা নথিভুক্ত করুন</button>
    </div>

    <!-- ===== নথিভুক্তি (অ্যাডমিন) ===== -->
    <div id="enroll" class="hidden">
      <div class="card">
        <b>চেহারা নথিভুক্তি</b>
        <div class="hint">শিক্ষক বেছে নিয়ে ক্যামেরার সামনে বসুন। ৫টা ছবি স্বয়ংক্রিয়ভাবে নেওয়া হবে (সোজা, ডানে, বামে)। শুধু ১২৮টি সংখ্যার ছাপ জমা হয়, ছবি জমা হয় না।</div>
        <select id="tsel"></select>
        <div class="cam" style="aspect-ratio: 4/3"><video id="vid2" autoplay playsinline muted></video><div class="ring"></div><div class="tip" id="etip">শিক্ষক বেছে "শুরু করুন" চাপুন</div></div>
        <div id="prog"><i></i></div>
        <button class="full" id="startBtn" onclick="startEnroll()">শুরু করুন</button>
        <button class="red full" id="clearBtn" onclick="clearFace()">এই শিক্ষকের ফেস ডেটা মুছুন</button>
        <button class="light full" onclick="backKiosk()">← হাজিরায় ফিরুন</button>
        <div id="emsg" class="hint"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
  <script>
    // ↓↓↓ আগের পেজগুলোর সেই একই /exec লিংক ↓↓↓
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL7jo2DJdwI__PmCTIaCgeXYzVMOzb_w3D62EdQ0ezckxIphi4WQq2aOK0SgueF-b1Sg/exec';
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';

    // মিল-সংক্রান্ত সীমা (কম = কড়া)
    const MATCH_MAX = 0.50;      // এর বেশি দূরত্ব হলে চেনা হবে না
    const MARGIN_MIN = 0.06;     // সেরা ও দ্বিতীয় জনের ব্যবধান এর কম হলে সন্দেহজনক
    const NEED_FRAMES = 3;       // পরপর এতগুলো ফ্রেমে একই জন হলে তবেই হাজিরা

    let PIN = '', ADMIN = '';
    try { PIN = localStorage.getItem('att_pin') || ''; } catch (e) {}

    let FACES = [], TEACHERS = [];
    let stream = null, loopTimer = null, busy = false, streak = { id: null, n: 0 };
    const lastDone = {};         // আইডি -> সময়, একই জনকে বারবার না পাঠানোর জন্য
    let modelsReady = false, mode = 'kiosk';

    const $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function askPin() {
      const p = prompt('স্ক্যানার পিন দিন');
      if (p && p.trim()) { PIN = p.trim(); try { localStorage.setItem('att_pin', PIN); } catch (e) {} }
      return !!PIN;
    }
    function askAdmin() {
      const p = prompt('অ্যাডমিন পিন দিন');
      if (p && p.trim()) { ADMIN = p.trim(); }
      return !!ADMIN;
    }

    function api(action, params, retried) {
      const q = new URLSearchParams(Object.assign({ action: action, pin: PIN }, params || {}));
      return fetch(API_URL + '?' + q.toString()).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.badPin) {
          PIN = ''; try { localStorage.removeItem('att_pin'); } catch (e) {}
          if (!retried && askPin()) return api(action, params, true);
        }
        return j;
      });
    }
    function adminGet(action) {
      const q = new URLSearchParams({ action: action, admin: ADMIN });
      return fetch(API_URL + '?' + q.toString()).then(function (r) { return r.json(); });
    }
    // text/plain পাঠালে ব্রাউজার preflight করে না, Apps Script তাতে ঠিকমতো সাড়া দেয়
    function adminPost(obj) {
      obj.admin = ADMIN;
      return fetch(API_URL, { method: 'POST', body: JSON.stringify(obj) }).then(function (r) { return r.json(); });
    }

    function beep(ok) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(); o.frequency.value = ok ? 880 : 300; o.connect(ctx.destination); o.start();
        setTimeout(function () { o.stop(); ctx.close(); }, ok ? 120 : 350);
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
    }

    // ---------- মডেল ও ক্যামেরা ----------
    async function loadModels() {
      if (modelsReady) return;
      await faceapi.tf.ready();
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      modelsReady = true;
    }
    async function startCam(videoEl) {
      stopCam();
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      videoEl.srcObject = stream;
      await videoEl.play().catch(function () {});
    }
    function stopCam() {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      clearTimeout(loopTimer);
    }
    function detect(videoEl) {
      return faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
        .withFaceLandmarks().withFaceDescriptor();
    }
    function dist(a, b) { let s = 0; for (let i = 0; i < 128; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); }

    // সবচেয়ে কাছের শিক্ষক ও দ্বিতীয় কাছের জনের দূরত্ব
    function bestMatch(desc) {
      const per = FACES.map(function (t) {
        let m = 9; t.faces.forEach(function (f) { const d = dist(desc, f); if (d < m) m = d; });
        return { t: t, d: m };
      }).sort(function (a, b) { return a.d - b.d; });
      return { best: per[0] || null, second: per[1] || null };
    }

    // ---------- কিয়স্ক লুপ ----------
    async function initKiosk() {
      mode = 'kiosk';
      $('tip').textContent = 'মডেল লোড হচ্ছে (প্রথমবার কিছুক্ষণ লাগতে পারে)...';
      try { await loadModels(); } catch (e) { $('tip').textContent = 'মডেল লোড হয়নি। ইন্টারনেট দেখে রিফ্রেশ দিন।'; return; }
      if (!PIN && !askPin()) { $('tip').textContent = 'পিন ছাড়া চলবে না। রিফ্রেশ দিন।'; return; }
      $('tip').textContent = 'শিক্ষকদের তথ্য আনা হচ্ছে...';
      try {
        const c = await api('config'); if (c && c.ok && c.school) $('school').textContent = c.school + ' — শিক্ষক হাজিরা';
        const f = await api('tfaces');
        if (!f.ok) { $('tip').textContent = f.msg || 'তথ্য আনা যায়নি'; return; }
        FACES = f.teachers;
      } catch (e) { $('tip').textContent = 'সংযোগ হয়নি। ইন্টারনেট ও API_URL দেখুন।'; return; }
      if (!FACES.length) { $('tip').textContent = 'এখনো কারও চেহারা নথিভুক্ত নেই। নিচে অ্যাডমিন বাটনে যান।'; }
      try { await startCam($('vid')); } catch (e) { $('tip').textContent = 'ক্যামেরার অনুমতি পাওয়া যায়নি। ব্রাউজারে Allow করে রিফ্রেশ দিন।'; return; }
      if (FACES.length) $('tip').textContent = 'ক্যামেরার সামনে সোজা তাকান';
      loop();
    }

    async function loop() {
      if (mode !== 'kiosk' || !stream) return;
      try {
        if (!busy && FACES.length) {
          const r = await detect($('vid'));
          if (!r) { streak = { id: null, n: 0 }; $('tip').textContent = 'ক্যামেরার সামনে সোজা তাকান'; }
          else {
            const m = bestMatch(r.descriptor);
            const ok = m.best && m.best.d <= MATCH_MAX && (!m.second || (m.second.d - m.best.d) >= MARGIN_MIN);
            if (!ok) {
              streak = { id: null, n: 0 };
              $('tip').textContent = (m.best && m.best.d <= MATCH_MAX + 0.08) ? 'নিশ্চিত হতে পারছি না, একটু কাছে এসে সোজা তাকান' : 'চেহারা চেনা যাচ্ছে না';
            } else {
              const id = m.best.t.id;
              streak = streak.id === id ? { id: id, n: streak.n + 1 } : { id: id, n: 1 };
              $('tip').textContent = 'চেনা হচ্ছে... ' + m.best.t.name;
              if (streak.n >= NEED_FRAMES) { streak = { id: null, n: 0 }; await confirmCheck(m.best.t); }
            }
          }
        }
      } catch (e) { /* এক ফ্রেমের ত্রুটি উপেক্ষা */ }
      loopTimer = setTimeout(loop, 450);
    }

    async function confirmCheck(t) {
      const now = Date.now();
      if (lastDone[t.id] && now - lastDone[t.id] < 30000) { $('tip').textContent = t.name + ': হাজিরা একটু আগেই নেওয়া হয়েছে'; return; }
      busy = true;
      $('result').className = ''; $('result').textContent = 'হাজিরা নেওয়া হচ্ছে...';
      try {
        const res = await api('tcheck', { id: t.id });
        lastDone[t.id] = Date.now();
        show(res);
        loadList();
      } catch (e) { show({ ok: false, type: 'error', msg: 'সংযোগ ত্রুটি। ইন্টারনেট দেখুন।' }); }
      await sleep(3500);
      busy = false;
    }

    function show(r) {
      const box = $('result');
      box.className = r.type || '';
      let h = '<div class="big">' + esc(r.msg || '') + '</div>';
      if (r.name) h += '<div style="font-size:18px">' + esc(r.name) + (r.desig ? ' — ' + esc(r.desig) : '') + '</div>';
      if (r.time) h += '<div style="font-size:13px;opacity:.8">' + esc(String(r.time).substring(0, 8)) + '</div>';
      box.innerHTML = h;
      beep(!!r.ok);
    }

    // ---------- আজকের তালিকা ----------
    const SLAB = { present: 'উপস্থিত', late: 'দেরি', absent: 'অনুপস্থিত' };
    function loadList() {
      return api('tsummary').then(function (s) {
        if (!s || !s.ok) return;
        $('today').textContent = s.date;
        $('listBox').innerHTML =
          '<div class="sum"><div><b>' + s.total + '</b>মোট</div><div><b>' + s.present + '</b>উপস্থিত</div><div><b>' + s.late + '</b>দেরি</div><div><b>' + s.absent + '</b>অনুপস্থিত</div></div>' +
          '<table>' + s.list.map(function (x) {
            return '<tr><td><i class="dot d-' + x.status + '"></i>' + esc(x.name) + '</td><td>' +
              (x.inn ? 'আসা ' + esc(x.inn.substring(0, 5)) : SLAB[x.status]) + (x.out ? '<br>যাওয়া ' + esc(x.out.substring(0, 5)) : '') + '</td></tr>';
          }).join('') + '</table>';
      }).catch(function () {});
    }
    function toggleList() { $('listBox').classList.toggle('hidden'); loadList(); }

    // ---------- নথিভুক্তি ----------
    async function goEnroll() {
      if (!ADMIN && !askAdmin()) return;
      $('emsg').textContent = '';
      let j;
      try { j = await adminGet('tlist'); } catch (e) { alert('সংযোগ হয়নি'); return; }
      if (!j.ok) { ADMIN = ''; alert(j.msg || 'ভুল অ্যাডমিন পিন'); return; }
      TEACHERS = j.teachers;
      $('tsel').innerHTML = TEACHERS.map(function (t) {
        return '<option value="' + esc(t.id) + '">' + esc(t.name) + (t.desig ? ' — ' + esc(t.desig) : '') + (t.enrolled ? '  ✓' : '  (নথিভুক্ত নয়)') + '</option>';
      }).join('');
      stopCam(); mode = 'enroll';
      $('kiosk').classList.add('hidden'); $('enroll').classList.remove('hidden');
      $('etip').textContent = 'মডেল লোড হচ্ছে...';
      try { await loadModels(); await startCam($('vid2')); $('etip').textContent = 'শিক্ষক বেছে "শুরু করুন" চাপুন'; }
      catch (e) { $('etip').textContent = 'ক্যামেরা বা মডেল চালু হয়নি'; }
    }
    function backKiosk() {
      stopCam();
      $('enroll').classList.add('hidden'); $('kiosk').classList.remove('hidden');
      initKiosk();
    }

    async function startEnroll() {
      const id = $('tsel').value;
      if (!id || !stream) return;
      const steps = ['সোজা তাকান', 'একটু ডানে ঘুরুন', 'একটু বামে ঘুরুন', 'সোজা তাকিয়ে একটু হাসুন', 'আবার সোজা তাকান'];
      const samples = [];
      $('startBtn').disabled = true; $('emsg').textContent = '';
      for (let i = 0; i < steps.length; i++) {
        $('etip').textContent = (i + 1) + '/' + steps.length + ' — ' + steps[i];
        await sleep(1800);
        let r = null;
        for (let k = 0; k < 8 && !r; k++) {
          const x = await detect($('vid2'));
          if (x && x.detection.score > 0.6) r = x; else await sleep(400);
        }
        if (!r) { $('etip').textContent = 'চেহারা পাওয়া যায়নি, আবার চেষ্টা করুন'; $('startBtn').disabled = false; $('prog').firstChild.style.width = '0'; return; }
        samples.push(Array.from(r.descriptor).map(function (v) { return Math.round(v * 10000) / 10000; }));
        $('prog').firstChild.style.width = ((i + 1) * 100 / steps.length) + '%';
      }
      // সব ছবি একই ব্যক্তির কি না যাচাই
      let maxD = 0;
      for (let i = 0; i < samples.length; i++) for (let j = i + 1; j < samples.length; j++) maxD = Math.max(maxD, dist(samples[i], samples[j]));
      if (maxD > 0.65) {
        $('etip').textContent = 'ছবিগুলো মিলছে না, আবার চেষ্টা করুন'; $('emsg').textContent = 'একজনই সামনে থাকুন, আলো ভালো রাখুন।';
        $('startBtn').disabled = false; return;
      }
      $('etip').textContent = 'সংরক্ষণ হচ্ছে...';
      try {
        const res = await adminPost({ action: 'tenroll', id: id, faces: samples });
        if (res.ok) { $('etip').textContent = 'নথিভুক্ত হয়েছে ✓'; $('emsg').textContent = 'এবার "হাজিরায় ফিরুন" চেপে পরীক্ষা করুন।'; markEnrolled(id, true); }
        else { $('etip').textContent = res.msg || 'সংরক্ষণ হয়নি'; }
      } catch (e) { $('etip').textContent = 'সংযোগ ত্রুটি, আবার চেষ্টা করুন'; }
      $('startBtn').disabled = false;
    }
    function markEnrolled(id, v) {
      TEACHERS.forEach(function (t) { if (t.id === id) t.enrolled = v; });
      const keep = $('tsel').value;
      $('tsel').innerHTML = TEACHERS.map(function (t) {
        return '<option value="' + esc(t.id) + '">' + esc(t.name) + (t.desig ? ' — ' + esc(t.desig) : '') + (t.enrolled ? '  ✓' : '  (নথিভুক্ত নয়)') + '</option>';
      }).join('');
      $('tsel').value = keep;
    }
    async function clearFace() {
      const id = $('tsel').value;
      if (!id || !confirm('এই শিক্ষকের ফেস ডেটা মুছে ফেলবেন?')) return;
      try {
        const res = await adminPost({ action: 'tclear', id: id });
        $('emsg').textContent = res.ok ? 'মুছে ফেলা হয়েছে' : (res.msg || 'মোছা যায়নি');
        if (res.ok) markEnrolled(id, false);
      } catch (e) { $('emsg').textContent = 'সংযোগ ত্রুটি'; }
    }

    initKiosk();
  </script>
</body>
</html>
