<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="pwa.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ভর্তির আবেদন</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; background: #f4f6f8; color: #1f2937; }
    header { background: #0b6b4f; color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; }
    header small { opacity: .9; }
    .tabs { display: flex; gap: 6px; max-width: 680px; margin: 10px auto 0; padding: 0 12px; }
    .tabs button { flex: 1; background: #e5e7eb; color: #374151; font-weight: 600; }
    .tabs button.on { background: #0b6b4f; color: #fff; }
    .wrap { padding: 12px; max-width: 680px; margin: 0 auto; }
    .panel { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 16px; color: #0b6b4f; }
    label.l { display: block; font-size: 13px; color: #6b7280; margin: 10px 0 4px; }
    label.l b { color: #b91c1c; }
    input[type=text], input[type=tel], input[type=password], input[type=date], select, textarea {
      width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    textarea { min-height: 70px; resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .two.stack { grid-template-columns: 1fr; } }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts label { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid #d1d5db; border-radius: 999px; font-size: 15px; background: #fff; cursor: pointer; }
    .opts input { width: 18px; height: 18px; }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
    .chk input { width: 18px; height: 18px; }
    button { padding: 12px 16px; font-size: 15px; font-family: inherit; border: 0; border-radius: 10px; background: #0b6b4f; color: #fff; cursor: pointer; }
    button.sec { background: #374151; }
    button.warn { background: #b45309; }
    button:disabled { opacity: .5; cursor: default; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btns button { flex: 1; min-width: 120px; }
    .err { border-color: #dc2626 !important; background: #fef2f2 !important; }
    #formErr, #msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: none; }
    #formErr.on, #msg.on { display: block; background: #fee2e2; color: #991b1b; }
    #msg.info { background: #dbeafe; color: #1e40af; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .photoBox { display: flex; gap: 12px; align-items: center; }
    #phPrev { width: 90px; height: 120px; border: 2px dashed #9ca3af; border-radius: 10px; background: #f3f4f6 center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6b7280; text-align: center; flex: none; }
    .note { font-size: 13px; color: #6b7280; margin-top: 8px; line-height: 1.5; }
    #done { display: none; text-align: center; }
    #done .no { font-size: 28px; font-weight: 700; color: #0b6b4f; margin: 10px 0; letter-spacing: .04em; }
    #closed { display: none; background: #fef3c7; color: #92400e; padding: 14px; border-radius: 12px; text-align: center; }

    /* অফিস */
    #lock { display: none; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .bar > * { flex: 1; min-width: 130px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .stat { background: #f0fdf4; border-radius: 10px; padding: 8px 4px; text-align: center; }
    .stat b { display: block; font-size: 20px; color: #065f46; }
    .stat span { font-size: 12px; color: #6b7280; }
    .it { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .it .m { flex: 1; min-width: 0; }
    .it .m b { display: block; font-size: 15px; }
    .it .m span { font-size: 12px; color: #6b7280; }
    .st { font-size: 12px; font-style: normal; padding: 3px 9px; border-radius: 999px; background: #e5e7eb; color: #374151; white-space: nowrap; }
    .st-Pending { background: #dbeafe; color: #1e40af; }
    .st-Exam { background: #fef3c7; color: #92400e; }
    .st-Selected, .st-Admitted { background: #d1fae5; color: #065f46; }
    .st-Waiting { background: #ede9fe; color: #5b21b6; }
    .st-Rejected, .st-Problem { background: #fee2e2; color: #991b1b; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; overflow: auto; padding: 12px; }
    #modal .box { background: #fff; border-radius: 14px; max-width: 560px; margin: 0 auto; padding: 14px; }
    #modal .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
    #modal .kv b { color: #6b7280; font-weight: 500; }
    #modal .kv span { word-break: break-word; }
    #modal img { width: 90px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #d1d5db; float: right; margin-left: 10px; }

    /* ---------- প্রিন্ট করা ফর্ম (A4) ---------- */
    #sheet { position: absolute; left: -10000px; top: 0; }
    .pf { width: 190mm; height: 277mm; padding: 0; position: relative; font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; color: #111827; font-size: 10pt; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden; }
    .pf .brd { position: absolute; inset: 0; border: .6mm solid #0b6b4f; border-radius: 2mm; pointer-events: none; }
    .pf .in { position: absolute; inset: 4mm 6mm 4mm 6mm; }
    .pf .hd { display: flex; align-items: center; gap: 4mm; height: 24mm; }
    .pf .lg { width: 21mm; height: 21mm; border-radius: 50%; border: .8mm solid #f59e0b; background: #fff; color: #0b6b4f; display: flex; align-items: center; justify-content: center; font-size: 22pt; font-weight: 700; position: relative; overflow: hidden; flex: none; }
    .pf .lg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .pf .sn { flex: 1; text-align: center; }
    .pf .sn h1 { margin: 0; font-size: 21pt; line-height: 1.5; color: #0b6b4f; font-weight: 700; white-space: nowrap; }
    .pf .sn p { margin: 0; font-size: 9.5pt; color: #374151; line-height: 1.5; }
    .pf .rb { display: flex; align-items: center; gap: 3mm; margin-top: 2mm; }
    .pf .rb .tt { flex: 1; text-align: center; background: linear-gradient(100deg, #064e3b, #0b6b4f); color: #fff; border: .6mm solid #f59e0b; border-radius: 2mm; font-size: 15pt; font-weight: 700; line-height: 1.7; }
    .pf .bx { display: flex; align-items: center; gap: 1.5mm; font-size: 9.5pt; font-weight: 600; white-space: nowrap; }
    .pf .bx i { display: block; min-width: 26mm; height: 7mm; border: .3mm solid #0b6b4f; border-radius: 1.2mm; font-style: normal; font-weight: 700; padding: 0 1.5mm; line-height: 7mm; overflow: hidden; text-align: center; }
    .pf .ck { display: flex; gap: 6mm; align-items: center; margin-top: 3mm; font-size: 10pt; font-weight: 600; flex-wrap: wrap; }
    .pf .ck span { display: inline-flex; align-items: center; gap: 1.5mm; }
    .pf .cb { display: inline-block; width: 3.6mm; height: 3.6mm; border: .35mm solid #0b6b4f; position: relative; flex: none; }
    .pf .cb.on::after { content: ""; position: absolute; left: .9mm; top: -.5mm; width: 1.3mm; height: 2.7mm; border: solid #0b6b4f; border-width: 0 .55mm .55mm 0; transform: rotate(45deg); }
    .pf .dc { margin: 3mm 0 3mm; font-size: 9.6pt; line-height: 1.65; text-align: justify; }
    .pf .row { display: flex; gap: 3.5mm; align-items: flex-end; margin-bottom: 2.6mm; }
    .pf .fl { display: flex; align-items: flex-end; gap: 1.5mm; min-width: 0; }
    .pf .k { white-space: nowrap; font-size: 9.6pt; color: #1f2937; font-weight: 500; }
    .pf .v { flex: 1; min-width: 0; min-height: 6.4mm; border-bottom: .25mm solid #6b7280; padding: 0 1mm; font-weight: 700; font-size: 10pt; line-height: 6.2mm; white-space: nowrap; overflow: hidden; color: #0f172a; }
    .pf .v.ml { white-space: normal; line-height: 6.2mm; max-height: 12.9mm; }
    .pf .sb { display: flex; gap: 4mm; margin-top: 1mm; }
    .pf .sb .lf { flex: 1; min-width: 0; }
    .pf .ph { width: 30mm; height: 36mm; border: .35mm solid #0b6b4f; border-radius: 1.5mm; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 8.5pt; color: #6b7280; overflow: hidden; flex: none; }
    .pf .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf .sg { display: flex; justify-content: space-around; gap: 6mm; margin-top: 10mm; }
    .pf .sg div { flex: 1; text-align: center; font-size: 9.2pt; font-weight: 600; color: #b91c1c; border-top: .3mm solid #6b7280; padding-top: 1mm; }
    .pf .of { margin-top: 5mm; }
    .pf .of .tt { text-align: center; background: linear-gradient(100deg, #064e3b, #0b6b4f); color: #fff; border: .5mm solid #f59e0b; border-radius: 2mm; font-size: 12.5pt; font-weight: 700; line-height: 1.7; margin-bottom: 4mm; }
    .pf .of .row { margin-bottom: 3.4mm; }
    .pf .ft { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 8pt; color: #6b7280; }


    .sub { display: flex; gap: 6px; margin-bottom: 12px; }
    .sub button { flex: 1; background: #e5e7eb; color: #374151; font-weight: 600; }
    .sub button.on { background: #0b6b4f; color: #fff; }
    .mk { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #f1f5f9; }
    .mk .m { flex: 1; min-width: 0; }
    .mk .m b { display: block; font-size: 15px; }
    .mk .m span { font-size: 12px; color: #6b7280; }
    .mk input { width: 76px; padding: 8px; font-size: 16px; text-align: center; border: 1px solid #d1d5db; border-radius: 8px; }
    .mk input.saved { border-color: #10b981; background: #ecfdf5; }
    .mk input.fail { border-color: #dc2626; background: #fef2f2; }
    .mk .r { width: 62px; text-align: center; font-size: 12px; }
    .ex-i { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 14px; margin-bottom: 8px; }
    .ex-i b { color: #6b7280; font-weight: 500; }

    /* প্রবেশপত্র / তালিকা প্রিন্ট */
    .apg, .tp { width: 190mm; background: #fff; font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; color: #111827; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .apg { height: 277mm; display: flex; flex-direction: column; justify-content: space-between; }
    .ac { height: 88mm; border: .5mm solid #0b6b4f; border-radius: 2mm; padding: 3mm 4mm; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .ac .h { display: flex; align-items: center; gap: 3mm; height: 15mm; }
    .ac .lg { width: 13mm; height: 13mm; border-radius: 50%; border: .6mm solid #f59e0b; color: #0b6b4f; display: flex; align-items: center; justify-content: center; font-size: 15pt; font-weight: 700; position: relative; overflow: hidden; flex: none; }
    .ac .lg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .ac .sn { flex: 1; text-align: center; }
    .ac .sn b { display: block; font-size: 14pt; line-height: 1.5; color: #0b6b4f; white-space: nowrap; }
    .ac .sn span { font-size: 8.5pt; color: #374151; }
    .ac .tt { text-align: center; background: linear-gradient(100deg, #064e3b, #0b6b4f); color: #fff; border: .4mm solid #f59e0b; border-radius: 1.5mm; font-size: 11pt; font-weight: 700; line-height: 1.6; margin: 1mm 0 2mm; }
    .ac .bd { display: flex; gap: 3mm; flex: 1; min-height: 0; }
    .ac .ph { width: 26mm; height: 32mm; border: .3mm solid #0b6b4f; border-radius: 1.2mm; font-size: 8pt; color: #6b7280; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; flex: none; }
    .ac .ph img { width: 100%; height: 100%; object-fit: cover; }
    .ac .fl { flex: 1; min-width: 0; }
    .ac .r { display: flex; gap: 2mm; align-items: flex-end; margin-bottom: 1.6mm; }
    .ac .f { display: flex; align-items: flex-end; gap: 1mm; min-width: 0; }
    .ac .k { font-size: 8.8pt; white-space: nowrap; color: #1f2937; }
    .ac .v { flex: 1; min-width: 0; border-bottom: .2mm solid #6b7280; font-weight: 700; font-size: 9.6pt; line-height: 5.2mm; min-height: 5.2mm; padding: 0 1mm; white-space: nowrap; overflow: hidden; }
    .ac .big .v { font-size: 12pt; color: #0b6b4f; }
    .ac .nt { font-size: 8pt; color: #374151; line-height: 1.4; margin-top: 1mm; }
    .ac .sg { display: flex; justify-content: space-between; gap: 10mm; margin-top: auto; }
    .ac .sg div { flex: 1; text-align: center; font-size: 8pt; color: #b91c1c; border-top: .25mm solid #6b7280; padding-top: .6mm; font-weight: 600; }
    .tp { height: 277mm; }
    .tp h2 { margin: 0; text-align: center; color: #0b6b4f; font-size: 17pt; line-height: 1.5; }
    .tp .s { text-align: center; font-size: 10.5pt; color: #374151; margin-bottom: 4mm; }
    .tp table { width: 100%; border-collapse: collapse; font-size: 11pt; }
    .tp th { background: #0b6b4f; color: #fff; padding: 1.4mm 2mm; border: .25mm solid #0b6b4f; font-weight: 600; }
    .tp td { padding: 1.7mm 2mm; border: .25mm solid #9ca3af; }
    .tp td.c { text-align: center; }
    @media print { .apg, .tp { page-break-after: always; break-after: page; } .apg:last-child, .tp:last-child { page-break-after: auto; break-after: auto; } }
    @media print {
      html, body { background: #fff !important; }
      header, .tabs, .wrap, #modal { display: none !important; }
      #sheet { position: static; }
      .pf { page-break-after: always; break-after: page; }
      .pf:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" style="color:#fff;text-decoration:none;font-size:13px;opacity:.9">‹ স্ক্যানার মেনু</a>
    <h1 id="schoolH">ভর্তির আবেদন — অফিস</h1>
    <small id="yearH"></small>
  </header>
  <div class="wrap">
    <!-- ================= অফিস ================= -->
    <div id="office">
      <div class="panel" id="lock">
        <h2>অ্যাডমিন পিন</h2>
        <input type="password" id="pinIn" autocomplete="off" placeholder="অ্যাডমিন পিন">
        <div class="btns"><button id="pinBtn">ঢুকুন</button></div>
        <div id="msg"></div>
      </div>

      <div id="officeMain" style="display:none">
        <div class="sub"><button id="vA" class="on">আবেদন</button><button id="vE">ভর্তি পরীক্ষা</button></div>
        <div id="viewApps">
        <div class="panel">
          <div class="bar">
            <input type="text" id="q" placeholder="নাম / আবেদন নম্বর / মোবাইল খুঁজুন">
            <select id="fCls"><option value="">সব শ্রেণি</option></select>
            <select id="fSt"><option value="">সব অবস্থা</option></select>
          </div>
          <div class="stats">
            <div class="stat"><b id="sAll">০</b><span>মোট</span></div>
            <div class="stat"><b id="sNew">০</b><span>নতুন</span></div>
            <div class="stat"><b id="sSel">০</b><span>নির্বাচিত</span></div>
          </div>
          <div class="btns" style="margin-top:0">
            <button class="sec" id="reload">তালিকা নতুন করে আনুন</button>
            <button class="warn" id="printBlank">ফাঁকা ফর্ম প্রিন্ট</button>
          </div>
          <div id="listMsg" class="note"></div>
        </div>
        <div class="panel" id="list"></div>
        </div>

        <div id="viewExam" style="display:none">
          <div class="panel">
            <h2>ভর্তি পরীক্ষা</h2>
            <div class="ex-i" id="exInfo"></div>
            <div class="btns" style="margin-top:0">
              <button id="exAssign">রোল ও সিট দিন</button>
              <button class="warn" id="exCards">প্রবেশপত্র প্রিন্ট</button>
              <button class="warn" id="exSeats">সিট তালিকা প্রিন্ট</button>
            </div>
            <div class="btns">
              <button class="sec" id="exSelect">পাস করাদের "নির্বাচিত" করুন</button>
              <button class="sec" id="exMerit">মেধাতালিকা প্রিন্ট</button>
              <button class="sec" id="exPub">ফল প্রকাশ</button>
            </div>
            <div class="btns">
              <button id="exAdmit">নির্বাচিতদের ভর্তি নিশ্চিত করুন</button>
            </div>
            <div class="bar" style="margin-top:12px">
              <input type="text" id="eq" placeholder="নাম / রোল খুঁজুন">
              <select id="eCls"><option value="">সব শ্রেণি</option></select>
            </div>
            <div id="exMsg" class="note"></div>
          </div>
          <div class="panel" id="admRes" style="display:none"></div>
          <div class="panel" id="exList"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal"><div class="box" id="modalBox"></div></div>
  <div id="sheet"></div>

  <script>
    // ↓↓↓ Apps Script ডিপ্লয়ের /exec লিংক এখানে বসান ↓↓↓
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL7jo2DJdwI__PmCTIaCgeXYzVMOzb_w3D62EdQ0ezckxIphi4WQq2aOK0SgueF-b1Sg/exec';

    // ↓↓↓ প্রিন্ট করা ফর্মের তথ্য — নিজের মতো বদলান ↓↓↓
    const ADM = {
      nameFallback: 'ফয়যানে মদীনা কিন্ডারগার্টেন স্কুল',
      logoText: 'ফ',
      logoUrl: 'logo.png',
      address: 'ঠিকানা: মোহাম্মদপুর, ইছাখালী, রাঙ্গুনিয়া, চট্টগ্রাম',
      phone: 'মোবাইল: ০১৮৬৫৭৬০৫০৮',
      signsTop: ['পিতা/মাতার স্বাক্ষর', 'অভিভাবকের স্বাক্ষর'],
      signsOffice: ['হিসাবরক্ষকের স্বাক্ষর', 'সহকারী প্রধান শিক্ষকের স্বাক্ষর', 'প্রধান শিক্ষকের স্বাক্ষর'],
      declaration: 'আস্‌সালামু আলাইকুম ওয়া রাহমাতুল্লাহ। সবিনয় নিবেদন এই যে, আমি আমার নিম্নে বর্ণিত সন্তান/পোষ্যকে আপনার প্রতিষ্ঠানে ভর্তির জন্য আবেদন করছি। প্রতিষ্ঠানের সকল নিয়ম-কানুন মেনে চলার অঙ্গীকার করছি। অতএব, আমার সন্তানকে ভর্তির সুযোগ দানে বাধিত করবেন।'
    };

    const $ = function (id) { return document.getElementById(id); };
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // ঘরে না আঁটলে লেখা ছোট করা
    function fitAll(root) {
      root.querySelectorAll('[data-fit]').forEach(function (el) {
        let s = el.tagName === 'H1' ? 21 : 10;
        el.style.fontSize = s + 'pt';
        let g = 40;
        const ml = el.classList.contains('ml');
        while (g-- && s > 6 && (ml ? el.scrollHeight > el.clientHeight + 1 : el.scrollWidth > el.clientWidth + 1)) {
          s -= 0.3; el.style.fontSize = s.toFixed(1) + 'pt';
        }
      });
    }
    function printForms(list, blank) {
      $('sheet').innerHTML = list.map(function (d) { return formHtml(d, blank); }).join('');
      fitAll($('sheet'));
      const st = document.createElement('style');
      st.id = 'pg'; st.textContent = '@page { size: A4; margin: 10mm; }';
      document.head.appendChild(st);
      const done = function () {
        const s = $('pg'); if (s) s.remove();
        $('sheet').innerHTML = '';
        window.removeEventListener('afterprint', done);
      };
      window.addEventListener('afterprint', done);
      const imgs = Array.prototype.slice.call($('sheet').querySelectorAll('img')).map(function (im) {
        return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
      });
      Promise.all(imgs).then(function () { setTimeout(function () { window.print(); }, 250); });
    }

      }).catch(function () { el.disabled = false; el.classList.add('fail'); exSay('সংযোগ ত্রুটি, আবার দিন'); });
    });
    function loadExamQuiet() {      // মেধাক্রম নতুন করে আনা (ইনপুটে ফোকাস থাকলে বাদ)
      if (document.activeElement && document.activeElement.matches && document.activeElement.matches('#exList input')) return;
      get('examlist').then(function (j) { if (j && j.ok) { EX = j; renderExam(); } });
    }
    $('exAssign').onclick = function () {
      exSay('রোল ও সিট দেওয়া হচ্ছে...');
      get('examassign').then(function (r) {
        if (r && r.badAdmin) { badAdmin(); return; }
        loadExam(r && r.ok ? (r.assigned ? bn(r.assigned) + ' জনকে রোল/সিট দেওয়া হয়েছে (মোট ' + bn(r.rooms) + ' রুম)' : 'নতুন কেউ নেই — সবার রোল দেওয়া আছে') : ((r && r.msg) || 'হয়নি'));
      }).catch(function () { exSay('সংযোগ ত্রুটি'); });
    };
    $('exSelect').onclick = function () {
      if (!confirm('পাশ নম্বর পাওয়া সবার অবস্থা "নির্বাচিত" হবে। চালাবেন?')) return;
      get('examselect').then(function (r) { loadApps(); loadExam(r && r.ok ? bn(r.changed) + ' জনকে নির্বাচিত করা হয়েছে' : ((r && r.msg) || 'হয়নি')); });
    };
    $('exPub').onclick = function () {
      const on = !(EX.exam && EX.exam.published);
      if (!confirm(on ? 'ফল প্রকাশ করলে আবেদনকারীরা নম্বর ও ফল দেখতে পাবে। প্রকাশ করবেন?' : 'ফল প্রকাশ বন্ধ করবেন?')) return;
      get('exampublish', { on: on ? '1' : '0' }).then(function () { loadExam(); });
    };

    // প্রিন্ট: সাধারণ পাতা
    function printSheet(html) {
      $('sheet').innerHTML = html;
      fitAll($('sheet'));
      const st = document.createElement('style');
      st.id = 'pg'; st.textContent = '@page { size: A4; margin: 10mm; }';
      document.head.appendChild(st);
      const done = function () { const s = $('pg'); if (s) s.remove(); $('sheet').innerHTML = ''; window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      const imgs = Array.prototype.slice.call($('sheet').querySelectorAll('img')).map(function (im) {
        return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
      });
      Promise.all(imgs).then(function () { setTimeout(function () { window.print(); }, 250); });
    }
    function admitCard(d, x) {
      const school = (CFG && CFG.school) || ADM.nameFallback;
      const row = function (k, v, f, cls) { return '<div class="f' + (cls ? ' ' + cls : '') + '" style="flex:' + (f || 1) + '"><span class="k">' + k + '</span><span class="v" data-fit>' + esc(v || '') + '</span></div>'; };
      const ph = d.photo && /^data:image\//.test(d.photo) ? '<img alt="" src="' + d.photo + '">' : 'ছবি';
      return '<div class="ac"><div class="h"><div class="lg">' + esc(ADM.logoText) + (ADM.logoUrl ? '<img alt="" src="' + esc(ADM.logoUrl) + '" onerror="this.remove()">' : '') + '</div>' +
        '<div class="sn"><b data-fit>' + esc(school) + '</b><span>' + esc(ADM.address) + '</span></div></div>' +
        '<div class="tt">প্রবেশপত্র — ভর্তি পরীক্ষা ' + esc(bn(CFG.year || '')) + '</div>' +
        '<div class="bd"><div class="ph">' + ph + '</div><div class="fl">' +
        '<div class="r">' + row('নাম:', d.name, 1) + '</div>' +
        '<div class="r">' + row('পিতার নাম:', d.father, 1) + '</div>' +
        '<div class="r">' + row('শ্রেণি:', d.cls, 1.1) + row('জন্ম তারিখ:', bn(d.dob), 1) + '</div>' +
        '<div class="r">' + row('রোল:', bn(d.roll), 1, 'big') + row('রুম:', bn(d.room), 1, 'big') + row('সিট:', bn(d.seat), 1, 'big') + '</div>' +
        '<div class="r">' + row('তারিখ:', x.date, 1.4) + row('সময়:', x.time, 1) + '</div>' +
        (x.venue ? '<div class="r">' + row('স্থান:', x.venue, 1) + '</div>' : '') +
        '<div class="nt">' + esc(x.note || '') + ' (আবেদন নং ' + esc(d.appNo) + ' • পূর্ণমান ' + esc(bn(x.total)) + ')</div></div></div>' +
        '<div class="sg"><div>পরীক্ষার্থীর স্বাক্ষর</div><div>প্রধান শিক্ষকের স্বাক্ষর</div></div></div>';
    }
    function chunk(a, n) { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; }
    $('exCards').onclick = function () {
      const list = exFiltered().filter(function (a) { return a.roll; });
      if (!list.length) { exSay('রোল পাওয়া কেউ নেই'); return; }
      const groups = chunk(list.map(function (a) { return a.appNo; }), 10), cards = [];
      let n = 0, exam = EX.exam;
      (function next() {
        if (n >= groups.length) {
          cards.sort(function (a, b) { return Number(a.roll) - Number(b.roll); });
          exSay(''); printSheet(chunk(cards, 3).map(function (g) { return '<div class="apg">' + g.map(function (d) { return admitCard(d, exam); }).join('') + '</div>'; }).join(''));
          return;
        }
        exSay('প্রবেশপত্র তৈরি হচ্ছে... ' + bn(Math.min(n * 10, list.length)) + '/' + bn(list.length));
        get('examcards', { nos: groups[n].join(',') }).then(function (r) {
          if (!r || !r.ok) { exSay((r && r.msg) || 'আনা যায়নি'); return; }
          cards.push.apply(cards, r.cards); exam = r.exam || exam; n++; next();
        }).catch(function () { exSay('সংযোগ ত্রুটি'); });
      })();
    };
    function tablePage(title, sub, head, rows) {
      return '<div class="tp"><h2>' + esc(title) + '</h2><div class="s">' + esc(sub) + '</div><table><tr>' +
        head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' + rows.join('') + '</table></div>';
    }
    $('exSeats').onclick = function () {
      const list = exFiltered().filter(function (a) { return a.roll; });
      if (!list.length) { exSay('রোল পাওয়া কেউ নেই'); return; }
      const rooms = {};
      list.forEach(function (a) { (rooms[a.room] = rooms[a.room] || []).push(a); });
      const x = EX.exam, school = CFG.school || ADM.nameFallback;
      printSheet(Object.keys(rooms).sort(function (a, b) { return a - b; }).map(function (rm) {
        const arr = rooms[rm].sort(function (a, b) { return Number(a.seat) - Number(b.seat); });
        return tablePage(school, 'ভর্তি পরীক্ষা ' + bn(CFG.year || '') + ' — রুম ' + bn(rm) + ' — ' + arr[0].cls + (x.date ? ' — ' + x.date : '') + (x.time ? ', ' + x.time : ''),
          ['সিট', 'রোল', 'পরীক্ষার্থীর নাম', 'পিতার নাম', 'স্বাক্ষর'],
          arr.map(function (a) { return '<tr><td class="c">' + bn(a.seat) + '</td><td class="c">' + bn(a.roll) + '</td><td>' + esc(a.name) + '</td><td>' + esc(a.father) + '</td><td style="width:32mm"></td></tr>'; }));
      }).join(''));
    };
    $('exMerit').onclick = function () {
      const list = exFiltered().filter(function (a) { return a.marks !== ''; });
      if (!list.length) { exSay('কারো নম্বর তোলা হয়নি'); return; }
      const by = {};
      list.forEach(function (a) { (by[a.cls] = by[a.cls] || []).push(a); });
      const school = CFG.school || ADM.nameFallback, order = EX.classes || [];
      printSheet(Object.keys(by).sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); }).map(function (c) {
        const arr = by[c].sort(function (a, b) { return Number(a.merit) - Number(b.merit); });
        return tablePage(school, 'ভর্তি পরীক্ষা ' + bn(CFG.year || '') + ' — মেধাতালিকা — ' + c + ' (পূর্ণমান ' + bn(EX.exam.total) + ', পাশ ' + bn(EX.exam.pass) + ')',
          ['ক্রম', 'রোল', 'নাম', 'পিতার নাম', 'নম্বর', 'ফল'],
          arr.map(function (a) { return '<tr><td class="c">' + bn(a.merit) + '</td><td class="c">' + bn(a.roll) + '</td><td>' + esc(a.name) + '</td><td>' + esc(a.father) + '</td><td class="c">' + bn(a.marks) + '</td><td class="c">' + (a.result === 'Pass' ? 'পাস' : 'ফেল') + '</td></tr>'; }));
      }).join(''));
    };


    // ভর্তি নিশ্চিত → Students শিট
    let LASTADM = [];
    function admitDone(r) {
      if (r && r.badAdmin) { badAdmin(); return; }
      if (!r || !r.ok) { exSay((r && r.msg) || 'হয়নি'); return; }
      LASTADM = r.students;
      $('admRes').style.display = 'block';
      $('admRes').innerHTML = '<h2>' + bn(r.count) + ' জন ভর্তি হয়েছে (Students শিটে যোগ হয়েছে)</h2>' +
        '<div class="note">অভিভাবক পিন এখানেই একবার দেখানো হচ্ছে। স্লিপ প্রিন্ট করে অভিভাবককে দিন। পরে শিটের H কলামেও আছে।</div>' +
        r.students.map(function (x) { return '<div class="it" style="cursor:default"><div class="m"><b>' + esc(x.name) + '</b><span>আইডি ' + esc(x.id) + ' • ' + esc(x.cls) + ' • রোল ' + bn(x.roll) + ' • পিন ' + esc(x.pin) + '</span></div></div>'; }).join('') +
        '<div class="btns"><button class="warn" id="admPrint">ভর্তি স্লিপ প্রিন্ট</button></div>';
      $('admPrint').onclick = printAdmitSlips;
      exSay(''); loadApps(); loadExam();
    }
    $('exAdmit').onclick = function () {
      if (!confirm('"নির্বাচিত" সবাইকে Students শিটে যোগ করা হবে এবং আইডি/রোল/পিন দেওয়া হবে। চালাবেন?')) return;
      exSay('ভর্তি করা হচ্ছে...');
      get('appadmit').then(admitDone).catch(function () { exSay('সংযোগ ত্রুটি, শিট দেখে নিন'); });
    };
    function printAdmitSlips() {
      const school = CFG.school || ADM.nameFallback, order = CFG.classes || [];
      const arr = LASTADM.slice().sort(function (a, b) { return order.indexOf(a.cls) - order.indexOf(b.cls) || a.roll - b.roll; });
      printSheet(tablePage(school, 'ভর্তি সম্পন্ন শিক্ষার্থীর তালিকা — শিক্ষাবর্ষ ' + bn(CFG.year || ''),
        ['আইডি', 'নাম', 'শ্রেণি', 'রোল', 'অভিভাবক মোবাইল', 'পোর্টাল পিন'],
        arr.map(function (x) { return '<tr><td class="c">' + esc(x.id) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.cls) + '</td><td class="c">' + bn(x.roll) + '</td><td class="c">' + esc(bn(x.phone)) + '</td><td class="c">' + esc(x.pin) + '</td></tr>'; })));
    }

    function closeModal() { $('modal').style.display = 'none'; }
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
  </script>
</body>
</html>
