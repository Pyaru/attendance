<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="pwa.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6b4f">
  <title>ছাত্র · QR হাজিরা</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; background: #f4f6f8; color: #1f2937; }
    header { background: #0b6b4f; color: #fff; padding: 10px 16px 0; }
    header a { color: #fff; font-size: 12px; text-decoration: none; opacity: .9; }
    header h1 { margin: 2px 0 0; font-size: 18px; }
    header small { opacity: .85; font-size: 12px; }
    .tabs { display: flex; gap: 6px; margin-top: 10px; }
    .tabs button { flex: 1; padding: 11px 6px; font-size: 15px; border: 0; border-radius: 10px 10px 0 0; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; font-family: inherit; }
    .tabs button.on { background: #f4f6f8; color: #0b6b4f; font-weight: 700; }
    .wrap { padding: 12px; max-width: 540px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 12px; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 11px; color: #6b7280; }
    .cam { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
    #reader { position: absolute; inset: 0; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    .cam .frame { position: absolute; left: 8%; right: 8%; top: 12%; bottom: 20%; border: 2px dashed rgba(255,255,255,.7); border-radius: 8px; pointer-events: none; }
    .cam .tip { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; color: #fff; text-align: center; background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 14px; pointer-events: none; }
    .cam.live .frame { display: none; }
    .result { margin: 0 0 12px; padding: 14px; border-radius: 12px; background: #fff; text-align: center; min-height: 70px; font-size: 16px; }
    .result .big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .result img.photo { width: 120px; height: 120px; object-fit: cover; border-radius: 14px; margin: 0 auto 8px; display: block; border: 3px solid rgba(0,0,0,.12); }
    .present { background: #d1fae5 !important; color: #065f46; }
    .late { background: #fef3c7 !important; color: #92400e; }
    .duplicate { background: #dbeafe !important; color: #1e40af; }
    .error { background: #fee2e2 !important; color: #991b1b; }
    .b { padding: 12px 16px; font-size: 15px; font-family: inherit; border: 0; border-radius: 10px; background: #0b6b4f; color: #fff; cursor: pointer; }
    .b.light { background: #e5e7eb; color: #111827; }
    .full { width: 100%; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    input[type=text] { flex: 1; min-width: 0; padding: 12px; font-size: 16px; font-family: inherit; border: 1px solid #d1d5db; border-radius: 10px; }
    details summary { cursor: pointer; font-size: 14px; }
    .hint { font-size: 13px; color: #6b7280; }
    ol { margin: 8px 0 0; padding-left: 22px; } li { padding: 4px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">‹ অফিস মেনু</a>
    <h1>ছাত্র · QR হাজিরা</h1>
    <small id="today"></small>
    <div class="tabs">
      <button id="tabA" class="on" onclick="setTab('A')">হাজিরা</button>
      <button id="tabL" onclick="setTab('L')">অনুপস্থিত তালিকা</button>
    </div>
  </header>

  <div class="wrap">
    <div id="pA">
      <div class="stats">
        <div class="stat"><b id="sTotal">-</b><span>মোট</span></div>
        <div class="stat"><b id="sPresent">-</b><span>উপস্থিত</span></div>
        <div class="stat"><b id="sLate">-</b><span>দেরি</span></div>
        <div class="stat"><b id="sAbsent">-</b><span>অনুপস্থিত</span></div>
      </div>
      <div class="cam" id="cam">
        <div id="reader"></div>
        <div class="frame"></div>
        <div class="tip" id="tip">প্রস্তুত — ক্যামেরা চালু করুন</div>
      </div>
      <button id="startBtn" class="b full" onclick="toggleCam()">ক্যামেরা চালু করুন</button>
      <div id="resultS" class="result">QR বা বারকোড ক্যামেরার সামনে ধরুন</div>
      <div class="card">
        <details>
          <summary>▸ স্ক্যান না হলে: হাতে আইডি লিখুন</summary>
          <div class="row">
            <input type="text" id="manualId" placeholder="আইডি লিখুন (যেমন S001)" autocomplete="off">
            <button class="b" onclick="manualSubmit()">জমা</button>
          </div>
        </details>
      </div>
      <button class="b light full" id="camBtn" onclick="flipCam()">ক্যামেরা বদলান</button>
    </div>

    <div id="pL" class="hidden">
      <div class="card" id="absentBox">লোড হচ্ছে...</div>
      <button class="b light full" onclick="loadSummary()">রিফ্রেশ</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // ↓↓↓ আগের পেজগুলোর সেই একই /exec লিংক ↓↓↓
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL7jo2DJdwI__PmCTIaCgeXYzVMOzb_w3D62EdQ0ezckxIphi4WQq2aOK0SgueF-b1Sg/exec';

    let PIN = '';
    try { PIN = localStorage.getItem('att_pin') || ''; } catch (e) {}
    const $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function askPin() {
      const p = prompt('স্ক্যানার পিন দিন');
      if (p && p.trim()) { PIN = p.trim(); try { localStorage.setItem('att_pin', PIN); } catch (e) {} }
      return !!PIN;
    }
    function api(action, params, retried) {
      const q = new URLSearchParams(Object.assign({ action: action, pin: PIN }, params || {}));
      return fetch(API_URL + '?' + q.toString()).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.badPin) {
          PIN = ''; try { localStorage.removeItem('att_pin'); } catch (e) {}
          if (!retried && askPin()) return api(action, params, true);
        }
        return j;
      });
    }
    function beep(ok) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(); o.frequency.value = ok ? 880 : 300; o.connect(ctx.destination); o.start();
        setTimeout(function () { o.stop(); ctx.close(); }, ok ? 120 : 350);
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
    }

    function setTab(t) {
      $('tabA').classList.toggle('on', t === 'A'); $('tabL').classList.toggle('on', t === 'L');
      $('pA').classList.toggle('hidden', t !== 'A'); $('pL').classList.toggle('hidden', t !== 'L');
      if (t === 'L') { stopCam(); loadSummary(); }
    }

    // ক্যামেরা: 'environment' = পেছনের, 'user' = সামনের (পছন্দ ফোনে মনে থাকে)
    let scanner = null, sBusy = false, lastCode = '', lastTime = 0;
    let facing = 'environment';
    try { facing = localStorage.getItem('att_cam') === 'user' ? 'user' : 'environment'; } catch (e) {}
    function camLabel() { $('camBtn').textContent = 'ক্যামেরা বদলান (এখন: ' + (facing === 'user' ? 'সামনের' : 'পেছনের') + ')'; }
    function flipCam() {
      facing = facing === 'user' ? 'environment' : 'user';
      try { localStorage.setItem('att_cam', facing); } catch (e) {}
      camLabel();
      if (scanner) stopCam().then(startCam);
    }
    function toggleCam() { if (scanner) stopCam(); else startCam(); }

    function startCam() {
      if (scanner) return;
      if (!PIN && !askPin()) { show({ ok: false, type: 'error', msg: 'পিন ছাড়া চলবে না। পেজ রিফ্রেশ দিন।' }); return; }
      loadSummary();
      const s = new Html5Qrcode('reader');
      scanner = s;
      $('tip').textContent = 'ক্যামেরা চালু হচ্ছে...';
      const box = function (w, h) { const m = Math.floor(Math.min(w, h) * 0.8); return { width: m, height: m }; };
      s.start({ facingMode: facing }, { fps: 10, qrbox: box }, onScan, function () {})
        .then(function () {
          if (scanner !== s) { s.stop().catch(function () {}); return; }
          $('cam').classList.add('live'); $('tip').textContent = 'QR ঘরের ভেতরে ধরুন';
          $('startBtn').textContent = 'ক্যামেরা বন্ধ করুন';
        })
        .catch(function (err) {
          if (scanner === s) scanner = null;
          $('tip').textContent = 'ক্যামেরা চালু হয়নি';
          const why = (err && (err.name || err.message)) ? String(err.name || '') + ' ' + String(err.message || '') : String(err);
          show({ ok: false, type: 'error', msg: 'ক্যামেরা চালু হয়নি। ব্রাউজারে ক্যামেরার অনুমতি দিন। (' + why.trim() + ')' });
        });
    }
    function stopCam() {
      $('cam').classList.remove('live'); $('tip').textContent = 'প্রস্তুত — ক্যামেরা চালু করুন';
      $('startBtn').textContent = 'ক্যামেরা চালু করুন';
      if (!scanner) return Promise.resolve();
      const s = scanner; scanner = null;
      return s.stop().then(function () { try { s.clear(); } catch (e) {} }).catch(function () {});
    }
    function onScan(text) {
      const now = Date.now();
      if (sBusy || (text === lastCode && now - lastTime < 5000)) return;
      sBusy = true; lastCode = text; lastTime = now;
      send(text);
    }
    function manualSubmit() {
      const el = $('manualId'); const v = el.value.trim();
      if (!v || sBusy) return;
      if (!PIN && !askPin()) return;
      sBusy = true; send(v); el.value = '';
    }
    function send(id) {
      $('resultS').className = 'result'; $('resultS').textContent = 'যাচাই হচ্ছে...';
      api('scan', { id: id })
        .then(function (res) { show(res); sBusy = false; loadSummary(); })
        .catch(function () { show({ ok: false, type: 'error', msg: 'সংযোগ ত্রুটি। ইন্টারনেট ও API_URL দেখুন।' }); sBusy = false; });
    }
    function show(r) {
      const box = $('resultS');
      box.className = 'result ' + (r.type || '');
      let h = '';
      if (r.photo && /^data:image\//.test(r.photo)) h += '<img class="photo" alt="" src="' + r.photo + '">';
      h += '<div class="big">' + esc(r.msg || '') + '</div>';
      if (r.name) h += '<div>' + esc(r.name) + (r.cls ? ' — ' + esc(r.cls) : '') + (r.roll ? ' (রোল ' + esc(r.roll) + ')' : '') + '</div>';
      if (r.time) h += '<div style="font-size:13px;opacity:.8">' + esc(r.time) + '</div>';
      box.innerHTML = h;
      beep(!!r.ok);
    }
    function loadSummary() {
      return api('summary').then(function (s) {
        if (!s || !s.ok) return;
        $('today').textContent = s.date;
        $('sTotal').textContent = s.total; $('sPresent').textContent = s.present;
        $('sLate').textContent = s.late; $('sAbsent').textContent = s.absentCount;
        $('absentBox').innerHTML = !s.absent.length ? '<b>সবাই উপস্থিত</b>' :
          '<b>অনুপস্থিত (' + s.absent.length + ')</b><ol>' + s.absent.map(function (a) {
            return '<li>' + esc(a.name) + ' — ' + esc(a.cls) + (a.roll ? ' (রোল ' + esc(a.roll) + ')' : '') + '</li>';
          }).join('') + '</ol>';
      }).catch(function () {});
    }
    $('manualId').addEventListener('keydown', function (e) { if (e.key === 'Enter') manualSubmit(); });
    camLabel();
    if (!PIN) askPin();
    loadSummary();
  </script>
</body>
</html>
