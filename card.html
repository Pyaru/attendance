<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>আইডি কার্ড জেনারেটর</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; background: #f4f6f8; color: #1f2937; }
    header { background: #0b6b4f; color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; }
    header small { opacity: .85; }
    .wrap { padding: 12px; max-width: 640px; margin: 0 auto; }
    .panel { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 16px; }
    label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; }
    .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { flex: 1; min-width: 90px; padding: 12px 14px; font-size: 15px; border: 0; border-radius: 10px; background: #0b6b4f; color: #fff; cursor: pointer; }
    button.sec { background: #374151; }
    button.warn { background: #b45309; }
    button:disabled { opacity: .45; cursor: default; }
    #msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: none; }
    #msg.error { display: block; background: #fee2e2; color: #991b1b; }
    #msg.info { display: block; background: #dbeafe; color: #1e40af; }
    #lock { display: none; }
    button, input, select { font-family: inherit; }
    select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    #stuList { max-height: 270px; overflow: auto; margin-top: 10px; border: 1px solid #e5e7eb; border-radius: 10px; }
    #stuList label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; font-size: 14px; color: #1f2937; margin: 0; border-bottom: 1px solid #f1f5f9; }
    #stuList input { width: 18px; height: 18px; flex: none; }
    .wt { color: #b91c1c; font-size: 12px; margin-left: auto; text-align: right; }
    #cnt { margin-top: 10px; font-size: 14px; color: #065f46; font-weight: 600; }
    #bmsg { margin-top: 8px; font-size: 13px; color: #6b7280; }

    /* ---------- কার্ড (CR80 আড়াআড়ি: ৮৫.৬ × ৫৪ মিমি) ---------- */
    #stage { perspective: 1400px; width: min(100%, 520px); margin: 0 auto; }
    #flipper { position: relative; width: 100%; aspect-ratio: 85.6 / 54; transition: transform .6s; transform-style: preserve-3d; }
    #flipper.flipped { transform: rotateY(180deg); }
    #flipper .card { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    #flipper .card.back { transform: rotateY(180deg); }
    #cardWrap { display: none; }
    #stageLabel { text-align: center; font-size: 13px; color: #6b7280; margin-top: 8px; }

    .card {
      --u: 1.1682cqw;                     /* ১ মিমি */
      --g: #0b6b4f; --g2: #064e3b; --gold: #f59e0b;
      container-type: size;
      width: 100%; height: 100%;
      position: relative; overflow: hidden;
      background: #fff; color: #111827;
      border-radius: calc(var(--u) * 3);
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .card .abs { position: absolute; }
    .card .hdr { left: 0; top: 0; width: 100%; height: calc(var(--u) * 11.5); background: linear-gradient(100deg, var(--g2), var(--g)); color: #fff; }
    .card .logo { left: calc(var(--u) * 2); top: calc(var(--u) * 1.75); width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%; background: #fff; color: var(--g); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--u) * 4.6); border: calc(var(--u) * .5) solid var(--gold); }
    .card .school { color: #fff; left: calc(var(--u) * 12); right: calc(var(--u) * 2); top: calc(var(--u) * 1.2); padding-top: calc(var(--u) * 1); text-align: center; font-weight: 800; font-size: calc(var(--u) * 3.7); line-height: 1.45; white-space: nowrap; overflow: hidden; }
    .card .sub { left: calc(var(--u) * 12); right: calc(var(--u) * 2); top: calc(var(--u) * 7.6); text-align: center; font-size: calc(var(--u) * 2.1); letter-spacing: .08em; color: #fde68a; font-weight: 700; white-space: nowrap; }
    .card .logo { position: absolute; overflow: hidden; }
    .card .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 50%; }
    .card .ph { left: calc(var(--u) * 3); top: calc(var(--u) * 13.5); width: calc(var(--u) * 22); height: calc(var(--u) * 27); border: calc(var(--u) * .5) solid var(--g); border-radius: calc(var(--u) * 1.5); background: #e5e7eb; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: calc(var(--u) * 2.4); text-align: center; }
    .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .idb { left: calc(var(--u) * 3); top: calc(var(--u) * 42); width: calc(var(--u) * 22); height: calc(var(--u) * 5.2); background: var(--g); color: #fff; border-radius: calc(var(--u) * 2.6); font-weight: 800; font-size: calc(var(--u) * 2.9); display: flex; align-items: center; justify-content: center; white-space: nowrap; }
    .card .nm { left: calc(var(--u) * 28); top: calc(var(--u) * 13.2); width: calc(var(--u) * 54.5); font-weight: 800; font-size: calc(var(--u) * 4.4); line-height: 1.25; color: var(--g2); white-space: nowrap; overflow: hidden; }
    .card .rows { left: calc(var(--u) * 28); top: calc(var(--u) * 19.6); width: calc(var(--u) * 54.5); font-size: calc(var(--u) * 2.9); line-height: 1.38; }
    .card .rows div { display: flex; white-space: nowrap; }
    .card .rows b { flex: 0 0 calc(var(--u) * 16); font-weight: 600; color: #4b5563; }
    .card .rows b::after { content: " :"; }
    .card .rows span { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .card .bc { left: calc(var(--u) * 28); top: calc(var(--u) * 41.6); width: calc(var(--u) * 54.5); height: calc(var(--u) * 6.4); }
    .card .bc svg { width: 100%; height: 100%; display: block; }
    .card .bct { left: calc(var(--u) * 28); top: calc(var(--u) * 48); width: calc(var(--u) * 54.5); text-align: center; font-size: calc(var(--u) * 2.2); letter-spacing: .25em; color: #374151; }
    .card .bar { left: 0; bottom: 0; width: 100%; height: calc(var(--u) * 2); background: linear-gradient(90deg, var(--gold), var(--g)); }

    .card .tt { left: calc(var(--u) * 4); top: calc(var(--u) * 3); width: calc(var(--u) * 50); font-size: calc(var(--u) * 2.7); line-height: 1.5; }
    .card .tt div { display: flex; white-space: nowrap; }
    .card .tt b { flex: 0 0 calc(var(--u) * 15.5); font-weight: 600; color: #4b5563; }
    .card .tt b::after { content: " :"; }
    .card .tt span { font-weight: 800; color: var(--g2); }
    .card .terms { left: calc(var(--u) * 4); top: calc(var(--u) * 13); width: calc(var(--u) * 53); font-size: calc(var(--u) * 2.5); line-height: 1.5; color: #1f2937; }
    .card .terms h4 { margin: 0 0 calc(var(--u) * .4); font-size: calc(var(--u) * 2.5); color: var(--g); text-decoration: underline; }
    .card .terms ol { list-style-type: bengali; margin: 0; padding-left: calc(var(--u) * 3.2); }
    .card .qr { left: calc(var(--u) * 59); top: calc(var(--u) * 3.2); width: calc(var(--u) * 23); height: calc(var(--u) * 23); padding: calc(var(--u) * 1); border: calc(var(--u) * .35) solid var(--g); border-radius: calc(var(--u) * 1.5); background: #fff; }
    .card .qr svg { width: 100%; height: 100%; display: block; }
    .card .qrt { left: calc(var(--u) * 59); top: calc(var(--u) * 26.8); width: calc(var(--u) * 23); text-align: center; font-weight: 800; font-size: calc(var(--u) * 2.6); color: var(--g2); }
    .card .sig { left: calc(var(--u) * 59); top: calc(var(--u) * 36); width: calc(var(--u) * 23); text-align: center; font-size: calc(var(--u) * 2.1); color: #374151; }
    .card .sig i { display: block; border-top: calc(var(--u) * .3) solid #374151; margin-bottom: calc(var(--u) * .5); }
    .card .ftr { left: 0; bottom: 0; width: 100%; height: calc(var(--u) * 8.4); background: linear-gradient(100deg, var(--g2), var(--g)); color: #fff; text-align: center; font-size: calc(var(--u) * 2.3); line-height: 1.45; padding-top: calc(var(--u) * 1.3); white-space: nowrap; overflow: hidden; }
    .card .ftr b { color: #fde68a; }

    /* ---------- প্রিন্ট ---------- */
    #sheet { position: absolute; left: -10000px; top: 0; }
    .cw { width: 85.6mm; height: 54mm; }
    #sheet .cl { display: none; }
    @media print {
      html, body { background: #fff !important; }
      header, .wrap { display: none !important; }
      #sheet { position: static; }
      #sheet .card { box-shadow: none; border: .2mm solid #cbd5e1; }
      .single { display: flex; gap: 8mm; justify-content: center; padding-top: 12mm; }
      .single .cl { display: block; text-align: center; font-size: 9pt; color: #6b7280; margin-top: 2mm; }
      .pg { display: grid; grid-template-columns: 85.6mm 85.6mm; grid-auto-rows: 54mm; gap: 2mm 6mm; justify-content: center; page-break-after: always; break-after: page; }
      .pg:last-child { page-break-after: auto; break-after: auto; }
      .pp { width: 85.6mm; height: 108mm; page-break-after: always; break-after: page; }
      .pp:last-child { page-break-after: auto; break-after: auto; }
      .pp .card { border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>আইডি কার্ড জেনারেটর</h1>
    <small id="sub">ID Card Search</small>
    <a href="./" style="float:right;color:#fff;font-size:14px;text-decoration:underline">← স্ক্যানার</a>
  </header>

  <div class="wrap">
    <div class="panel" id="lock">
      <h2>অ্যাডমিন পিন</h2>
      <label for="pinIn">কার্ড বানানোর পিন (স্ক্যানার পিন নয়)</label>
      <input type="password" id="pinIn" autocomplete="off">
      <div class="btns"><button id="pinBtn">ঢুকুন</button></div>
    </div>

    <div class="panel" id="main">
      <h2>ID Card Search</h2>
      <label for="idIn">ছাত্র/ছাত্রীর আইডি</label>
      <input type="text" id="idIn" list="ids" placeholder="যেমন S001" autocomplete="off" autocapitalize="characters">
      <datalist id="ids"></datalist>
      <div class="btns">
        <button id="searchBtn">Search</button>
        <button id="flipBtn" class="sec" disabled>Flip</button>
        <button id="printBtn" class="warn" disabled>Print A4</button>
        <button id="printCardBtn" class="sec" disabled>কার্ড প্রিন্টার (১ পাতা)</button>
      </div>
      <div id="msg"></div>
      <div id="cnt"></div>
    </div>

    <div class="panel" id="batch">
      <h2>ক্লাস অনুযায়ী কার্ড</h2>
      <label for="clsSel">ক্লাস বাছুন</label>
      <select id="clsSel"><option value="">— ক্লাস —</option></select>
      <div id="stuList"></div>
      <div class="btns">
        <button id="allBtn" class="sec">সব বাছাই / বাদ</button>
        <button id="loadBtn">কার্ড তৈরি করুন</button>
      </div>
      <div id="bmsg"></div>
    </div>

    <div id="cardWrap">
      <div id="stage"><div id="flipper"></div></div>
      <div id="stageLabel">সামনের দিক</div>
    </div>
  </div>

  <div id="sheet"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/qrcode-generator@2.0.4/dist/qrcode.js';document.head.appendChild(s)"></script>
  <script>
    // ↓↓↓ Apps Script ডিপ্লয়ের /exec লিংক এখানে বসান ↓↓↓
    const API_URL = 'https://script.google.com/macros/s/AKfycbyL7jo2DJdwI__PmCTIaCgeXYzVMOzb_w3D62EdQ0ezckxIphi4WQq2aOK0SgueF-b1Sg/exec';

    // ↓↓↓ কার্ডের পেছনের ফুটার/শর্ত — নিজের তথ্য দিন ↓↓↓
    const SCHOOL = {
      nameFallback: 'ফয়যানে মদীনা কিন্ডারগার্টেন স্কুল',
      logoText: 'ফ',
      logoUrl: 'logo.png',
      address: 'ঠিকানা: মোহাম্মদপুর, ইছাখালী, রাঙ্গুনিয়া, চট্টগ্রাম',
      phone: 'মোবাইল: ০১৮৬৫৭৬০৫০৮',
      signLabel: 'প্রধান শিক্ষকের স্বাক্ষর',
      terms: [
        'এই কার্ড শুধু প্রতিষ্ঠানের ছাত্র/ছাত্রীর জন্য, হস্তান্তরযোগ্য নয়।',
        'প্রতিদিন স্কুলে আসার সময় কার্ড সঙ্গে রাখতে হবে।',
        'কার্ড হারালে সাথে সাথে কর্তৃপক্ষকে জানান।',
        'কার্ড কুড়িয়ে পেলে নিচের ঠিকানায় ফেরত দিন।'
      ]
    };

    let ADMIN = '';
    try { ADMIN = sessionStorage.getItem('card_admin') || ''; } catch (e) {}
    let cur = null;
    let LIST = [];
    let printSet = [];
    let school = SCHOOL.nameFallback;

    const $ = function (id) { return document.getElementById(id); };
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function bn(s) {
      return String(s == null ? '' : s).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; });
    }
    function say(text, kind) {
      const m = $('msg');
      m.className = text ? kind : '';
      m.textContent = text || '';
    }

    // ---------- API ----------
    function api(action, params) {
      const q = new URLSearchParams(Object.assign({ action: action, admin: ADMIN }, params || {}));
      return fetch(API_URL + '?' + q.toString()).then(function (r) { return r.json(); });
    }
    function showMain(on) { $('main').style.display = on ? 'block' : 'none'; $('batch').style.display = on ? 'block' : 'none'; }
    function needLogin() {
      ADMIN = '';
      try { sessionStorage.removeItem('card_admin'); } catch (e) {}
      $('lock').style.display = 'block';
      showMain(false);
      $('pinIn').focus();
    }
    function login() {
      const v = $('pinIn').value.trim();
      if (!v) return;
      ADMIN = v;
      try { sessionStorage.setItem('card_admin', v); } catch (e) {}
      $('pinIn').value = '';
      $('lock').style.display = 'none';
      showMain(true);
      loadList();
    }
    $('pinBtn').onclick = login;
    $('pinIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

    function loadList() {
      api('cardlist').then(function (j) {
        if (j && j.badAdmin) { needLogin(); say('ভুল অ্যাডমিন পিন', 'error'); return; }
        if (!j || !j.ok) return;
        if (j.school) school = j.school;
        LIST = j.list; fillClasses();
        $('ids').innerHTML = j.list.map(function (s) {
          return '<option value="' + esc(s.id) + '">' + esc(s.name + ' — ' + s.cls) + '</option>';
        }).join('');
      }).catch(function () {});
    }

    // ---------- সার্চ ----------
    function search() {
      const id = $('idIn').value.trim();
      if (!id) { say('আইডি লিখুন', 'error'); return; }
      say('খোঁজা হচ্ছে...', 'info');
      api('cardget', { id: id }).then(function (d) {
        if (d && d.badAdmin) { needLogin(); say('ভুল অ্যাডমিন পিন', 'error'); return; }
        if (!d || !d.ok) { say((d && d.msg) || 'পাওয়া যায়নি', 'error'); return; }
        say('', '');
        printSet = [d];
        show(d);
      }).catch(function (e) {
        say('সংযোগ ত্রুটি। ইন্টারনেট ও API_URL দেখুন। (' + e.message + ')', 'error');
      });
    }
    $('searchBtn').onclick = search;
    $('idIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });

    // ---------- Code 128 (সেট B) বারকোড SVG ----------
    const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
    function barcodeSvg(text) {
      const codes = [104];
      let sum = 104;
      for (let i = 0; i < text.length; i++) {
        let v = text.charCodeAt(i) - 32;
        if (v < 0 || v > 94) v = '?'.charCodeAt(0) - 32;
        codes.push(v);
        sum += v * (i + 1);
      }
      codes.push(sum % 103, 106);
      let x = 10, rects = '';                     // ১০ মডিউল শান্ত জায়গা
      codes.forEach(function (c) {
        const p = C128[c];
        for (let i = 0; i < p.length; i++) {
          const w = +p[i];
          if (i % 2 === 0) rects += '<rect x="' + x + '" y="0" width="' + w + '" height="50"/>';
          x += w;
        }
      });
      const total = x + 10;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' 50" preserveAspectRatio="none" shape-rendering="crispEdges" fill="#000">' + rects + '</svg>';
    }

    // ---------- QR SVG (নিজেই আঁকা, শান্ত জায়গাসহ) ----------
    function qrSvg(text) {
      const q = qrcode(0, 'M');
      q.addData(text);
      q.make();
      const n = q.getModuleCount(), quiet = 2;
      let d = '';
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (q.isDark(r, c)) d += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
        }
      }
      const s = n + quiet * 2;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    }

    // ---------- কার্ডের দুই পিঠ ----------
    function frontHtml(d) {
      const photo = d.photo && /^data:image\//.test(d.photo)
        ? '<img alt="" src="' + d.photo + '">'
        : 'ছবি<br>নেই';
      return '' +
        '<div class="abs hdr"></div>' +
        '<div class="abs logo">' + esc(SCHOOL.logoText) + (SCHOOL.logoUrl ? '<img alt="" src="' + esc(SCHOOL.logoUrl) + '" onerror="this.remove()">' : '') + '</div>' +
        '<div class="abs school" data-fit="3.7">' + esc(d.school || school) + '</div>' +
        '<div class="abs sub">STUDENT ID CARD</div>' +
        '<div class="abs ph">' + photo + '</div>' +
        '<div class="abs idb">ID: ' + esc(d.id) + '</div>' +
        '<div class="abs nm" data-fit="4.4">' + esc(d.name) + '</div>' +
        '<div class="abs rows">' +
        '<div><b>শ্রেণি</b><span>' + esc(d.cls) + '</span></div>' +
        '<div><b>রোল</b><span>' + esc(bn(d.roll)) + '</span></div>' +
        '<div><b>জন্ম তারিখ</b><span>' + esc(bn(d.dob) || '—') + '</span></div>' +
        '<div><b>অভিভাবক</b><span>' + esc(bn(d.phone) || '—') + '</span></div>' +
        '</div>' +
        '<div class="abs bc">' + barcodeSvg(d.id) + '</div>' +
        '<div class="abs bct">' + esc(d.id) + '</div>' +
        '<div class="abs bar"></div>';
    }
    function backHtml(d) {
      return '' +
        '<div class="abs tt">' +
        '<div><b>ইস্যু তারিখ</b><span>' + esc(bn(d.issue) || '—') + '</span></div>' +
        '<div><b>মেয়াদ শেষ</b><span>' + esc(bn(d.expire) || '—') + '</span></div>' +
        '</div>' +
        '<div class="abs terms"><h4>শর্তাবলী</h4><ol>' +
          SCHOOL.terms.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
        '</ol></div>' +
        '<div class="abs qr">' + qrSvg(d.id) + '</div>' +
        '<div class="abs qrt">' + esc(d.id) + '</div>' +
        '<div class="abs sig"><i></i>' + esc(SCHOOL.signLabel) + '</div>' +
        '<div class="abs ftr"><b>' + esc(d.school || school) + '</b><br>' + esc(SCHOOL.address) + ' &nbsp;|&nbsp; ' + esc(SCHOOL.phone) + '</div>' +
        '<div class="abs bar" style="bottom:calc(var(--u)*8.4);height:calc(var(--u)*.8)"></div>';
    }

    // নামের লেখা বেশি লম্বা হলে ফন্ট ছোট করে ঘরে বসানো
    function fit(root) {
      root.querySelectorAll('[data-fit]').forEach(function (el) {
        let s = parseFloat(el.getAttribute('data-fit'));
        el.style.fontSize = 'calc(var(--u) * ' + s + ')';
        let guard = 30;
        while (el.scrollWidth > el.clientWidth + 1 && s > 1.8 && guard--) {
          s -= 0.2;
          el.style.fontSize = 'calc(var(--u) * ' + s.toFixed(2) + ')';
        }
      });
    }

    function show(d) {
      cur = d;
      const f = frontHtml(d), b = backHtml(d);
      $('flipper').className = '';
      $('flipper').innerHTML = '<div class="card front">' + f + '</div><div class="card back">' + b + '</div>';
      $('cardWrap').style.display = 'block';
      $('stageLabel').textContent = 'সামনের দিক';
      ['flipBtn', 'printBtn', 'printCardBtn'].forEach(function (i) { $(i).disabled = false; });
      fit($('flipper'));
      cnt();
    }

    $('flipBtn').onclick = function () {
      const fl = $('flipper');
      fl.classList.toggle('flipped');
      $('stageLabel').textContent = fl.classList.contains('flipped') ? 'পেছনের দিক' : 'সামনের দিক';
    };

    // ---------- ক্লাস অনুযায়ী ----------
    function cnt() {
      $('cnt').textContent = printSet.length ? 'প্রিন্টের জন্য প্রস্তুত: ' + bn(printSet.length) + 'টি কার্ড' : '';
    }
    function fillClasses() {
      const set = {};
      LIST.forEach(function (s) { set[s.cls] = 1; });
      const cl = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
      const sel = $('clsSel'), keep = sel.value;
      sel.innerHTML = '<option value="">— ক্লাস —</option>' + cl.map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
      sel.value = keep;
    }
    function renderStu() {
      const c = $('clsSel').value;
      const rows = LIST.filter(function (s) { return s.cls === c; });
      $('stuList').innerHTML = rows.map(function (s) {
        const w = [];
        if (!s.photo) w.push('ছবি নেই');
        if (!s.dates) w.push('তারিখ নেই');
        return '<label><input type="checkbox" value="' + esc(s.id) + '" checked> ' + esc(s.name) +
          ' <small>(' + esc(s.id) + ')</small>' + (w.length ? '<span class="wt">⚠ ' + w.join(', ') + '</span>' : '') + '</label>';
      }).join('');
      $('bmsg').textContent = c ? 'মোট ' + bn(rows.length) + ' জন। যাদের বাদ দিতে চান তাদের টিক তুলে দিন।' : '';
    }
    $('clsSel').onchange = renderStu;
    $('allBtn').onclick = function () {
      const boxes = $('stuList').querySelectorAll('input');
      let anyOff = false;
      boxes.forEach(function (b) { if (!b.checked) anyOff = true; });
      boxes.forEach(function (b) { b.checked = anyOff; });
    };
    $('loadBtn').onclick = function () {
      const ids = [];
      $('stuList').querySelectorAll('input:checked').forEach(function (b) { ids.push(b.value); });
      if (!ids.length) { $('bmsg').textContent = 'আগে ক্লাস বেছে অন্তত একজনকে টিক দিন'; return; }
      const got = [];
      let i = 0;
      $('loadBtn').disabled = true;
      (function next() {
        if (i >= ids.length) {
          $('loadBtn').disabled = false;
          if (!got.length) { $('bmsg').textContent = 'কোনো কার্ড আনা যায়নি'; return; }
          printSet = got;
          show(got[0]);
          $('bmsg').textContent = 'তৈরি। ওপরে প্রথম কার্ডের প্রিভিউ দেখাচ্ছে; প্রিন্ট বাটন চাপুন।';
          return;
        }
        $('bmsg').textContent = 'কার্ড আনা হচ্ছে: ' + bn(Math.min(i, ids.length)) + '/' + bn(ids.length);
        const chunk = ids.slice(i, i + 6);
        api('cardmany', { ids: chunk.join(',') }).then(function (j) {
          if (j && j.badAdmin) { needLogin(); $('loadBtn').disabled = false; return; }
          if (j && j.ok) j.cards.forEach(function (c) { got.push(c); });
          i += chunk.length;
          next();
        }).catch(function (e) {
          $('loadBtn').disabled = false;
          $('bmsg').textContent = 'সংযোগ ত্রুটি (' + e.message + '); ' + bn(got.length) + 'টি আনা গেছে।';
        });
      })();
    };

    // ---------- প্রিন্ট ----------
    function cw(inner) { return '<div class="cw"><div class="card">' + inner + '</div></div>'; }
    function buildSheet(mode) {
      const sh = $('sheet');
      let h = '';
      if (mode === 'card') {
        // কার্ড প্রিন্টার: প্রতি ছাত্র এক পাতা, ওপরে সামনে নিচে পেছনে
        printSet.forEach(function (d) { h += '<div class="pp">' + cw(frontHtml(d)) + cw(backHtml(d)) + '</div>'; });
      } else if (printSet.length === 1) {
        const d = printSet[0];
        h = '<div class="single"><div>' + cw(frontHtml(d)) + '<span class="cl">সামনে</span></div><div>' + cw(backHtml(d)) + '<span class="cl">পেছনে</span></div></div>';
      } else {
        // A4: এক পাতায় ১০টি। আগে সব সামনের পাতা, তারপর পেছনের পাতা (জোড়ায় জোড়ায় ডানবাম উল্টানো)
        const chunks = [];
        for (let i = 0; i < printSet.length; i += 10) chunks.push(printSet.slice(i, i + 10));
        chunks.forEach(function (ch) { h += '<div class="pg">' + ch.map(function (d) { return cw(frontHtml(d)); }).join('') + '</div>'; });
        chunks.forEach(function (ch) {
          const arr = ch.map(function (d) { return cw(backHtml(d)); });
          if (arr.length % 2) arr.push('<div></div>');
          for (let j = 0; j + 1 < arr.length; j += 2) { const t = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = t; }
          h += '<div class="pg">' + arr.join('') + '</div>';
        });
      }
      sh.innerHTML = h;
      fit(sh);
    }
    function doPrint(mode) {
      if (!printSet.length) return;
      buildSheet(mode);
      const st = document.createElement('style');
      st.id = 'pg';
      st.textContent = mode === 'card'
        ? '@page { size: 85.6mm 108mm; margin: 0; }'
        : '@page { size: A4; margin: 8mm; }';
      document.head.appendChild(st);
      const done = function () {
        const s = $('pg'); if (s) s.remove();
        $('sheet').innerHTML = '';
        window.removeEventListener('afterprint', done);
      };
      window.addEventListener('afterprint', done);
        const imgs = Array.prototype.slice.call($('sheet').querySelectorAll('img')).map(function (im) {
        return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
      });
      Promise.all(imgs).then(function () { setTimeout(function () { window.print(); }, 250); });
    }
    $('printBtn').onclick = function () { doPrint('a4'); };
    $('printCardBtn').onclick = function () { doPrint('card'); };

    // ---------- শুরু ----------
    if (ADMIN) { showMain(true); loadList(); } else { needLogin(); }
  </script>
</body>
</html>
